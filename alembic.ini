# Alembic configuration for CloudDisk.
# The URL is read from DATABASE_URL by alembic/env.py; the placeholder below
# is never used directly.

[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder only; alembic/env.py loads DATABASE_URL from Settings/.env.
sqlalchemy.url = sqlite:///data/clouddisk.db
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
